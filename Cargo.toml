[package]
name = "beautifuldisk"
version = "0.3.3"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
dither-gpui = "0.1.0"
gpui-kit = "=0.7.3"
libc = "0.2.191"
rayon = "1.12.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# Finder icons, FSEvents and the Full Disk Access helper.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "NSApplication", "NSResponder", "NSEvent", "NSView", "NSWindow", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSRunningApplication", "NSScreen", "NSGraphics"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGWindow"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "FSEvents", "dispatch2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSBundle", "NSFileManager", "NSError", "NSDictionary", "NSGeometry", "NSURL", "NSArray", "NSValue", "NSEnumerator"] }
raw-window-handle = "0.6.2"

# Updates from GitHub releases. macOS uses Sparkle, bundled by bundle.sh.
[target.'cfg(target_os = "linux")'.dependencies]
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz"] }

# GPUI is slow unoptimized; optimize dependencies so debug builds animate smoothly.
[profile.dev.package."*"]
opt-level = 3
